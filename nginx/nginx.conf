worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

 # Definición de los Microservicios (Upstreams)
    upstream productos_backend {
        server localhost:8081;
        keepalive 32;
    }
    upstream ordenes_backend {
        server localhost:8082;
        keepalive 32;
    }

    limit_req_zone $binary_remote_addr zone=mylimit:10m rate=5r/s;

    server {
        listen 8080;
        server_name localhost;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name localhost;
        ssl_certificate certs/localhost.crt;
        ssl_certificate_key certs/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        access_log logs/api_access.log;
        error_log  logs/api_error.log;

        location /productos {
            limit_req zone=mylimit burst=10 nodelay;
            proxy_pass http://productos_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ordenes {
            if ($http_x_api_key != "mi-secreto-123") {
                add_header Content-Type application/json always;
                return 401 '{"error": "No autorizado"}';
            }
            proxy_pass http://ordenes_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        error_page 404 /404.json;
        location = /404.json {
            internal;
            default_type application/json;
            return 404 '{"error": "Recurso no encontrado en el Gateway"}';
        }
    }
}
